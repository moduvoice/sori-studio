[project]
name = "sori-hub"
version = "0.1.0"
description = "Sori Studio hub - local open-source TTS engines behind one API"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sori_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
