id: qwen3-tts
name: Qwen3-TTS
recipe_version: 1
role: tts
summary: 가장 범용적인 엔진. 자연스럽고 감정 지시도 받아요. NVIDIA GPU 에서 써요.
maker: Alibaba Qwen
