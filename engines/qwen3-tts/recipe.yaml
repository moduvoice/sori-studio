  gpu_mem_gb: 5.8        # Windows 스팟 실측 2026-11-17
  ram_gb: 8
  load_s: 40
  sample_rate: 24000
human_eval:
  line: 가장 범용적이에요. 범용적인 모든 능력을 갖췄어요.
  short: 범용 1위
  by: 사람 평가 1명(2026-11-16)
good_for: [유튜브·설명 나레이션, 오디오북, 범용]

license:
  id: apache-2.0
  name: Apache-2.0
  url: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  commercial: "yes"
  text_file: LICENSE-weights.txt
  summary:
    - 개인·회사 모두 상업적으로 쓸 수 있어요.
    - 모델을 고쳐 다시 배포할 때는 라이선스 원문과 바꾼 점을 함께 줘야 해요.
