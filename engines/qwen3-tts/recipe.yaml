  at: "2026-11-16"
  evidence: verified
  cer_ko: 0.0094
  hallu: "5/647"
  rtf_gpu: 2.4           # Windows 스팟 실측(RTX PRO 4500, 한 줄씩, GPU 사용률 13% - 묶음 없이는 CPU·호출 대기가 병목). 벤치 묶음 16개는 0.60
