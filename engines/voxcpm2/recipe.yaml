packages:
  win-x64: {cuda: requirements-win-x64-cu130.txt, cpu: requirements-win-x64-cpu.txt}
env_bytes: {cuda: 4250000000, cpu: 1200000000}   # cuda 는 Windows 스팟 실측, cpu 는 추정
requires: {nvidia_driver: 580}
pip_index: {cuda: "https://download.pytorch.org/whl/cu130", cpu: "https://download.pytorch.org/whl/cpu"}

