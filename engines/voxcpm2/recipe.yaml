# VoxCPM2 레시피(판 1, 2026-11-17). 공용 기본 목소리 12명(참조 클립)으로 말해요.
id: voxcpm2
name: VoxCPM2
recipe_version: 1
role: tts
summary: 48kHz 고음질. 긴 글에 강해요. 공용 목소리 12명으로 말해요.
maker: OpenBMB
homepage: https://github.com/OpenBMB/VoxCPM

devices: {cpu: ok, nvidia: ok, mac: unverified}
measured:
  syll_rate: 5.0        # 초당 한글 음절(Windows 스팟 소리 실측 2026-11-17) - 길이 검사 기준
  at: "2026-11-16"
  evidence: verified
  cer_ko: 0.0093
  hallu: "3/687"
  sim_ref: 0.76
  rtf_gpu: 1.3           # Windows 스팟 실측(한 줄씩). 벤치 0.51
  rtf_cpu: 8.0           # 추정 - CPU 는 매우 느림
  gpu_mem_gb: 8.4        # Windows 스팟 실측 2026-11-17(벤치 기록 6.6 보다 큼)
  ram_gb: 10
  load_s: 40
  sample_rate: 48000
human_eval:
  line: 자연스러워요. 약간 현장음이 들리는 느낌이 있어요. 가끔 대본에 없는 말(외국어)이 끼어요 - 길이 검사로 다시 만들어요.
  short: 자연스러움 좋음·잔잡음 조금
  by: 사람 평가 1명(2026-11-16)
good_for: [오디오북·긴 글, 고음질 나레이션]

license:
  id: apache-2.0
  name: Apache-2.0
  url: https://huggingface.co/openbmb/VoxCPM2
  commercial: "yes"
  text_file: LICENSE-weights.txt
  summary:
    - 개인·회사 모두 상업적으로 쓸 수 있어요.
    - 모델을 고쳐 다시 배포할 때는 라이선스 원문과 바꾼 점을 함께 줘야 해요.
    - 남의 목소리를 복제할 때는 그 사람의 허락이 필요해요(라이선스와 별개로 법·윤리).
maintenance: {status: active}

