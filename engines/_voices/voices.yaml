# 공용 기본 목소리 - 복제만 되는 엔진(VoxCPM2·Confucius4·CosyVoice3·ZONOS3·dots.tts)이 참조 클립으로 써요.
# 모두 Qwen3-TTS VoiceDesign(Apache-2.0)이 한국어 묘사로 만든 가상 인물이에요(실존 인물 아님). 자세한 것은 README.md.
# gender 는 묘사가 아니라 실제 소리의 평균 음높이로 정했어요(165Hz 미만 = m). 한국어 묘사로는 남성 지정이 잘 안 돼서
# "남성" 으로 묘사한 6명 중 5명이 높은 음역으로 만들어졌어요(2026-11-17 측정).
