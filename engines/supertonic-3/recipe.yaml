# Supertonic-3 엔진 레시피(판 1). 허브가 이 파일대로 설치·실행해요. 설명: docs/sori-studio-features.md 4.4·4.10·4.11.
id: supertonic-3
name: Supertonic-3
recipe_version: 1
role: tts
summary: 가볍고 정확한 CPU 엔진. GPU 없이 바로 써요. 알림·안내·빠른 초안에 좋아요.
maker: 수퍼톤(국내)
homepage: https://github.com/supertone-oss-archive/supertonic

# 장치: native = 그 장치용 엔진, ok = 됨, no = 안 됨, unverified = 측정 없음
devices: {cpu: native, nvidia: "no", mac: unverified}

# 측정(oh-my-tts 벤치 2026-11-16, g7.8xlarge CPU, 497줄). 판정·시간 한도·카드의 근거.
measured:
  syll_rate: 4.8        # 초당 한글 음절(Windows 스팟 소리 실측 2026-11-17) - 길이 검사 기준
  at: "2026-11-16"
  evidence: verified      # verified = 우리 측정 + 사람 평가 / measured = 기계 점수만 / unverified
  cer_ko: 0.0087          # 발음 오류율 0.87%
  hallu: "0/497"          # 대본에 없는 말이 낀 줄
  rtf_cpu: 0.49           # 소리 1초를 0.49초에 만듦(벤치). 이 개발 PC 8코어 4스레드 실측 0.30
  ram_gb: 1.5             # 추정 - 자가 시험 실측으로 고침
  load_s: 10              # 추정(개발 PC 실측 1.7초)
  sample_rate: 44100
human_eval:
  line: 기계적이지만 소리가 아주 정확하고 깨끗해요. 가볍고 빨라요.
  short: 기계적이나 정확·깨끗·빠름
  by: 사람 평가 1명(2026-11-16)
good_for: [알림·안내, 빠른 초안, GPU 없는 PC]

license:
  id: openrail-m
  name: BigScience Open RAIL-M
  url: https://huggingface.co/supertone-oss-archive/supertonic-3/blob/main/LICENSE
  commercial: conditional
  text_file: LICENSE-weights.txt     # 원문(공식 파일과 같음 - git blob 1e2cbe6 확인). 화면은 restrictions_from 부터 보여 줘요
  restrictions_from: "Attachment A"
  summary:
    - 모델을 쓰고 고칠 수 있고, 만든 소리를 상업적으로도 쓸 수 있어요.
    - 단 원문 부록 A 의 용도 제한을 지켜야 해요.
    - 특히 소리에 중요한 것 - 남이 기계가 만든 것임을 알 수 있게 밝히지 않고 퍼뜨리기, 동의 없이 다른 사람 흉내 내기(딥페이크), 남을 해칠 거짓 정보, 괴롭힘·명예훼손은 안 돼요.
    - 그 밖에 법 위반, 미성년자를 해치는 일, 차별, 의료 조언, 법 집행·이민 심사 판단 등에 쓸 수 없어요.
    - 모델을 남에게 넘길 때는 같은 용도 제한을 걸어야 해요. 요약은 참고용이고 원문이 우선해요.
maintenance:
  status: archived
  since: "2026-07-23"
  note: 개발사가 오픈소스 개발·지원을 끝내고 저장소를 보관 조직으로 옮겼어요. 업데이트·보안 패치가 없어요. 받은 파일은 계속 쓸 수 있어요.
  archive_url: https://huggingface.co/supertone-oss-archive/supertonic-3

