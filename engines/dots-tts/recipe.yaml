env_bytes: {cuda: 12600000000}    # 리눅스 스팟 실측(torch cu13 + sglang + flashinfer)
requires: {nvidia_driver: 580}
system_deps: {linux-x64: [cuda-toolkit-13-0]}   # SGLang 커널 즉석 컴파일용 정식 CUDA 툴킷(WSL2 는 허브가 NVIDIA 공식 저장소에서 깔아요)

