name: dots.tts (MeanFlow)
recipe_version: 1
role: tts
summary: 2026 새 모델. 48kHz 고음질이에요. 한국어는 공식 언어 목록에 없고 벤치 점수만 있어요. 공용 목소리 12명으로 말해요.
maker: dots-studio
homepage: https://huggingface.co/dots-studio/dots.tts-mf

devices: {cpu: "no", nvidia: ok, mac: "no"}
measured:
  evidence: unverified   # 우리 벤치 전 - 스팟 설치 확인만(2026-11-17)
  gpu_mem_gb: 10          # 추정(설치·소리는 32GB GPU 에서만 확인)
  gpu_tested_gb: 32       # 이보다 작은 GPU 는 '미검증'으로 보여요
  load_s: 300
  sample_rate: 48000
good_for: [고음질]

license:
  id: apache-2.0
  name: Apache-2.0
  url: https://huggingface.co/dots-studio/dots.tts-mf
  commercial: "yes"
  text_file: LICENSE-weights.txt
  summary:
    - 개인·회사 모두 상업적으로 쓸 수 있어요.
    - 복제는 본인 목소리나 허락받은 목소리만 써요.
    - 요약은 참고용이고 원문이 우선해요.
maintenance: {status: active}

python: "3.12"
runtime: {win-x64: wsl}           # 리눅스 전용(SGLang) - Windows 에서는 WSL2 안에서
packages: {linux-x64: ../_runtimes/sglang-omni/requirements-linux-x64.txt}
packages_nodeps: {linux-x64: ../_runtimes/sglang-omni/requirements-nodeps-linux-x64.txt}
code:
  - {url: "https://codeload.github.com/sgl-project/sglang-omni/zip/eeaf0390f5bcd4cd335217622db253df03c7fc7a", sha256: 6b56a9193c77619b84cde0a27bdc83c79d7e62b03dfe23ea091a053ede3c29f2, size: 40651276, dir: sglang-omni}
